<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
</head>
<body>
    <form action="http://next-app-router-playground-kohl.vercel.app/api/contact" method="POST" id="contact-form">
        <label for="name">Name: </label>
        <input type="text" id="name" name="name" placeholder="John Smith" required>

        <label for="email">Email: </label>
        <input type="email" id="email" name="email" placeholder="john.smith@example.com" required>

        <label for="message">Message: </label>
        <!--<input type="text" id="message" name="message" placeholder="Your message" required> -->
        <textarea id="message" name="message" placeholder="Your message" required></textarea>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
